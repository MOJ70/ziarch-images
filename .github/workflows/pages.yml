# Utility: run manually (Actions > this workflow > Run) if the Pages source or custom domain ever needs to be set again.
# Normal deploys need nothing here: every push to gh-pages is published by GitHub Pages automatically (branch build).
name: Set up GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Point Pages at the gh-pages branch with the custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" --input - <<'JSON'
          {"cname":"zistudio.art","https_enforced":true,"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}
          JSON
